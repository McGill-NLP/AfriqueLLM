## Actual submission: 4 nodes x 4 GPUs (16 total), ZeRO-2, batch/GPU 8, grad accumulation 2.
### model
model_name_or_path: google/gemma-3-4b-pt
# model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct
# trust_remote_code: true
# model_type: gemma3_text
# template: gemma3
template: empty
### method
stage: pt
packing: true
do_train: true
# finetuning_type: lora
# lora_rank: 8
# lora_target: all
finetuning_type: full
deepspeed: train/deepspeed/ds_z2_config.json
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
flash_attn: fa3

# dataset_dir: data/datasets/llamafactory-pretrain
cutoff_len: 16384
overwrite_cache: false
preprocessing_num_workers: 32
dataloader_num_workers: 32

### output
# output_dir: data/models/gemma-3-4b-pt/pretrain
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
data_shared_file_system: true

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs: 
  min_lr_rate: 0.01 # Will be overridden by command line for cosine scheduler
warmup_ratio: 0.001
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
weight_decay: 0.1 #  (float, optional, defaults to 0) — The weight decay to apply (if not zero) to all layers except all bias and LayerNorm weights in AdamW optimizer.
adam_beta1: 0.9 # (float, optional, defaults to 0.9) — The beta1 hyperparameter for the AdamW optimizer.
adam_beta2: 0.95 # (float, optional, defaults to 0.999) — The beta2 hyperparameter for the AdamW optimizer.

### training
# use_badam: true
# badam_mode: layer
# badam_switch_mode: ascending
# badam_switch_interval: 50
# badam_verbose: 2
# pure_bf16: true

### eval
# eval_dataset: c4_demo
# val_size: 0.1
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 500

# 92h not include swa
enable_liger_kernel: true
